# Alembic configuration.
#
# NOTE: this file is read by alembic using the OS locale encoding, so it is
# kept ASCII-only on purpose -- Chinese comments here break on Windows (GBK).
# See migrations/env.py for the annotated explanation.
#
# The database URL is NOT set here. migrations/env.py reads it from app.config
# so that .env stays the single source of truth. Duplicating the URL would let
# the two drift apart and run migrations against the wrong database.

[alembic]
script_location = migrations
prepend_sys_path = .
# Timestamp prefix keeps file order aligned with execution order.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
sqlalchemy_module_prefix = sa.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
