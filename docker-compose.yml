# RAG 知识库问答系统 - 容器编排
#
# 使用前请先复制环境变量模板：
#   cp backend/.env.example backend/.env
# 并把 JWT_SECRET 改成随机值（生成方式见 README「生产部署」一节）。
#
# 注意：本项目**不使用独立的 ChromaDB 服务**。向量库以嵌入式方式运行
# （chromadb.PersistentClient，数据落在 backend/chroma_data），
# 因此这里没有 chroma 容器——之前版本存在过，但它从未被后端连接，是死配置。

services:
  mysql:
    image: mysql:8.0
    container_name: rag-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rag_knowledge_base}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    healthcheck:
      # 建表交给应用启动时的 Alembic 迁移，这里只需确认 MySQL 真的可连
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    # 任务队列的 broker。文档处理任务存在这里，API 进程重启不会丢任务。
    image: redis:7-alpine
    container_name: rag-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    # appendonly 开启 AOF 持久化：Redis 重启后队列里的任务仍在。
    # 默认的 RDB 快照会丢最近几秒的数据，对任务队列来说不可接受。
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ollama:
    image: ollama/ollama
    container_name: rag-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rag_knowledge_base}
      OLLAMA_BASE_URL: http://ollama:11434
      CHROMA_PERSIST_DIR: /app/chroma_data
      UPLOAD_DIR: /app/uploads
      # 让 embedding 模型缓存落到挂载卷，避免每次重建镜像都重新下载
      HF_HOME: /app/huggingface_cache
      # 生产模式下强制走 Celery，Redis 挂了就直接报错，
      # 不允许悄悄降级成"会丢任务的本地线程"（详见 task_dispatch.py）
      TASK_QUEUE_MODE: celery
      REDIS_URL: redis://redis:6379/0
      APP_ENV: production
      LOG_FORMAT: json
      # 迁移由 backend 容器启动时执行；worker 不重复执行
      RUN_MIGRATIONS_ON_STARTUP: "true"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/chroma_data:/app/chroma_data
      - ./huggingface_cache:/app/huggingface_cache
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      # 镜像基于 python:3.11-slim，没有 curl，用标准库发请求
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=5).status==200 else 1)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Celery worker：与 backend 用同一个镜像，只是启动命令不同。
  # 拆成独立容器是有意为之的：
  #   1. 文档解析会吃满 CPU，跟 API 抢资源会让问答变慢
  #   2. 可以独立扩容（上传量大就多加 worker，不用动 API）
  #   3. worker 崩溃不影响 API 可用性
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag-worker
    command: celery -A app.celery_app:celery_app worker --loglevel=info --concurrency=2
    env_file:
      - ./backend/.env
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rag_knowledge_base}
      OLLAMA_BASE_URL: http://ollama:11434
      CHROMA_PERSIST_DIR: /app/chroma_data
      UPLOAD_DIR: /app/uploads
      HF_HOME: /app/huggingface_cache
      REDIS_URL: redis://redis:6379/0
      APP_ENV: production
      LOG_FORMAT: json
      # worker 不负责建表/迁移，那是 backend 启动时的事。
      # 两个容器同时跑迁移会导致并发 DDL 冲突。
      RUN_MIGRATIONS_ON_STARTUP: "false"
      RECONCILE_ON_STARTUP: "false"
    volumes:
      # 必须与 backend 挂载路径完全一致：worker 要读上传的源文件、
      # 往同一个 ChromaDB 目录写向量
      - ./backend/uploads:/app/uploads
      - ./backend/chroma_data:/app/chroma_data
      - ./huggingface_cache:/app/huggingface_cache
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # 必须是 build args 而不是 environment：Vite 在构建时把地址编译进 JS 产物，
      # 容器启动后再设环境变量对已构建的静态文件没有任何作用。
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    container_name: rag-frontend
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  ollama_data:
